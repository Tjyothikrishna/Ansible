#Commonly used magic variables
#hostvars: You can access variable defined by any host in the play
#groups: Print the dictionary or map with all groups in inventory and each group has the list of hosts that belongs to it.
#group_names: List gorups the current host is part of
#inventory_hostname: Inventory name of the current host being iterated over in the play.
---
- name: Demonstrate magic variable
  hosts: sapprod
  tasks:
   - name: print the hostgroup
     debug:
      var: groups
   - name: print the host_names
     debug:
      var: group_names
   - name: print the inventory_hostname
     debug:
      var: inventory_hostname
   - name: print magic variable
     debug:
      var: hostvars
...
